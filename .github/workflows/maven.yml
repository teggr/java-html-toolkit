name: Maven CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Run Maven reactor tests
        run: ./mvnw --no-transfer-progress clean test

      - name: Lint VS Code extension
        working-directory: vscode-extension
        run: npm run lint

      - name: Package VS Code extension
        run: ./mvnw --no-transfer-progress -pl vscode-extension package
